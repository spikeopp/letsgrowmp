name: Refresh Murachh data

# NREGASoft returns 401 to GitHub's (non-Indian) servers, so the weekly
# refresh runs on a local Mac instead. Kept for manual runs from an Indian runner.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch NREGASoft reports
        run: python3 scraper/fetch_murachh.py
      - name: Commit if changed
        run: |
          git config user.name "letsgrowmp-bot"
          git config user.email "letsgrowmp-bot@users.noreply.github.com"
          git add data/murachh.json
          git diff --cached --quiet || git commit -m "Refresh Murachh data $(date -u +%F)"
          git push
